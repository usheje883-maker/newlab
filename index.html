<div class="sidebar">
    <button class="button active" onclick="SetCategory('games', this)">Games</button>
    <button class="button" onclick="SetCategory('tools', this)">Tools</button>
    <button class="button" onclick="SetCategory('ports', this)">Ports</button>
    <button class="button" onclick="SetCategory('flash', this)">Flash</button>
    <button class="button" onclick="SetCategory('roms', this)">Roms</button>

<div class="games">
    <div class="template" id="gameentry">
        <img src="https://media.tenor.com/WtYEe3sIFIAAAAAM/boomer-sooner.gif">
        <h1>Template</h1>
    </div>
</div>

<script>
    const GAME_JSON_URL = "https://raw.githubusercontent.com/usheje883-maker/newlab/main/games.json";

    let allGames = [];
    let currentCategory = "games";

    async function LoadGames() {
        try {
            const response = await fetch(GAME_JSON_URL);

            if (!response.ok) {
                throw new Error("Failed to load games.json");
            }

            allGames = await response.json();

            DisplayGames();

        } catch (error) {
            console.error("Error loading games:", error);
        }
    }

    function DisplayGames() {
        const container = document.querySelector(".games");
        const template = document.querySelector("#gameentry");

        container.querySelectorAll(".gameentry").forEach(entry => {
            entry.remove();
        });

        const filteredGames = allGames.filter(game => {
            return String(game.category || "").toLowerCase() === currentCategory.toLowerCase();
        });

        for (const game of filteredGames) {
            const entry = template.cloneNode(true);

            entry.id = "";
            entry.className = "gameentry";
            entry.style.display = "flex";

            const image = entry.querySelector("img");
            const title = entry.querySelector("h1");

            if (image) {
                image.src = game.image || "";
                image.style.width = "150px";
                image.style.height = "150px";
                image.style.maxWidth = "150px";
                image.style.maxHeight = "150px";
                image.style.objectFit = "contain";
            }

            if (title) {
                title.textContent = game.name || "Unnamed Game";
            }

            entry.addEventListener("click", function() {
                if (game.link) {
                    window.location.href = game.link;
                }
            });

            container.appendChild(entry);
        }
    }

    function SetCategory(category, button) {
        currentCategory = category;

        document.querySelectorAll(".button").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        DisplayGames();
    }

    LoadGames();
</script>
