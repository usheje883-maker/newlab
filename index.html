<style>
    body {
        background-color: #272727;
        margin: 0;
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    .sidebar {
        background-color: #1e1e1e;
        width: 150px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 30px;
        order: 2;
        flex-shrink: 0;
    }

    .button {
        width: 100px;
        height: 100px;
        border-radius: 25px;
        background-color: #252525;
        border: none;
        color: white;
        font-size: 25px;
        cursor: pointer;
        font-weight: bold;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s ease;
    }

    .button:hover {
        transform: scale(1.15);
        background-color: #444444;
    }

    .button.active {
        background-color: #444444;
    }

    .games {
        background-color: #272727;
        height: 100vh;
        flex-grow: 1;
        order: 1;
        padding: 20px;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 20px;
        overflow-y: auto;
        box-sizing: border-box;
    }

    #gameentry {
        display: none;
    }

    .gameentry {
    background-color: #0b0b0b;
    height: 230px;
    width: 180px;
    min-width: 180px;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.2s ease, background-color 0.2s ease;
}

.gameentry:hover {
    transform: scale(1.05);
    background-color: #151515;
}

    .gameentry img {
        background-color: #0b0b0b;
        width: 150px;
        height: 150px;
        object-fit: contain;
        border-radius: 10px;
        flex-shrink: 0;
    }

    .gameentry h1 {
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
        margin: 0;
        padding: 0 8px;
        font-size: 18px;
        line-height: 22px;
        text-align: center;
        max-width: 164px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
</style>

<div class="sidebar">
    <button class="button active" onclick="SetCategory('', this)">Games</button>
    <button class="button" onclick="SetCategory('tools', this)">Tools</button>
    <button class="button" onclick="SetCategory('ports', this)">Ports</button>
    <button class="button" onclick="SetCategory('flash', this)">Flash</button>
    <button class="button" onclick="SetCategory('roms', this)">Roms</button>
</div>

<div class="games">
    <div id="gameentry">
        <img src="https://media.tenor.com/WtYEe3sIFIAAAAAM/boomer-sooner.gif">
        <h1>Template</h1>
    </div>
</div>

<script>
    const GAME_JSON_URL = "https://raw.githubusercontent.com/usheje883-maker/newlab/main/games.json";

    let allGames = [];
    let currentCategory = "";

    function renderGames(games) {
        const container = document.querySelector(".games");
        container.querySelectorAll(".gameentry").forEach(entry => entry.remove());

        for (const game of games) {
            const name = game.name || "Unknown Game";
            const image = game.image || "";
            const link = game.link || "";

            const entry = document.createElement("div");
            entry.className = "gameentry";

            const gameImage = document.createElement("img");
            gameImage.src = image;
            gameImage.alt = name;

            const gameName = document.createElement("h1");
            gameName.textContent = name;

            entry.appendChild(gameImage);
            entry.appendChild(gameName);

            if (link) {
                entry.addEventListener("click", function() {
                    window.location.href = `iframe.html?${encodeURIComponent(link)}`;
                });
            }

            container.appendChild(entry);
        }
    }

    function SetCategory(category, button) {
        currentCategory = category;

        document.querySelectorAll(".button").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        if (!category) {
            renderGames(allGames);
        } else {
            const filtered = allGames.filter(game =>
                game.genre &&
                game.genre.toLowerCase() === category.toLowerCase()
            );

            renderGames(filtered);
        }
    }

    async function LoadGames() {
        try {
            const response = await fetch(GAME_JSON_URL);

            if (!response.ok) {
                throw new Error(`Failed to fetch games.json: ${response.status}`);
            }

            allGames = await response.json();

            renderGames(allGames);
        } catch (error) {
            console.error("Error loading games:", error);
        }
    }

    document.addEventListener("DOMContentLoaded", LoadGames);
</script>
