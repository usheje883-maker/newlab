<style>
    body {
        background-color: #272727;
        margin: 0;
        display: flex; 
        height: 100vh;
        overflow: hidden; 
    }
    
    .sidebar {
        background-color: #1e1e1e;
        width: 150px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 30px;
        order: 2; 
    }
    
    .button {
        width: 100px;
        height: 100px;
        border-radius: 25px;
        background-color: #252525;
        border: none;
        color: white;
        font-size: 25px;
        cursor: pointer;
        font-weight: bold;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s ease;
    }
    
    .button:hover {
        transform: scale(1.15);
        background-color: #444444;
    }
    
    .games {
        background-color: white;
        height: 100vh;
        flex-grow: 1; 
        order: 1; 
    }

    #gameentry {
    background-color: black;
    height: 230px;
    width: 180px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    display: none;
}

#gameentry img {
    background-color: black;
    height: 150px;
    width: 150px;
    border-radius: 10px;
}

#gameentry h1 {
    color: white;
    font-weight: bold;
    margin: 0;
    font-size: 20px;
}
</style>

<div class="sidebar">
    <button class="button" onclick="SetCategory('games')">Games</button>
    <button class="button" onclick="SetCategory('tools')">Tools</button>
    <button class="button" onclick="SetCategory('ports')">Ports</button>
    <button class="button" onclick="SetCategory('flash')">Flash</button>
    <button class="button" onclick="SetCategory('roms')">Roms</button>
</div>

<div class="games">
    <div class="template" id="gameentry">
        <img src="https://media.tenor.com/WtYEe3sIFIAAAAAM/boomer-sooner.gif">
        <h1>Template</h1>
    </div>
</div>

<script>
    const GAME_JSON_URL = "https://raw.githubusercontent.com/usheje883-maker/newlab/main/games.json";

    async function LoadGames() {
        try {
            const response = await fetch(GAME_JSON_URL);

            if (!response.ok) {
                throw new Error("Failed to load games.json");
            }

            const games = await response.json();
            const container = document.querySelector(".games");
            const template = document.querySelector("#gameentry");

            for (const game of games) {
                const entry = template.cloneNode(true);

                entry.removeAttribute("id");
                entry.style.display = "flex";
                entry.classList.remove("template");

                const image = entry.querySelector("img");
                const title = entry.querySelector("h1");

                title.textContent = game.name;

                if (game.image) {
                    image.src = game.image;
                }

                entry.addEventListener("click", function() {
                    if (game.link) {
                        window.location.href = game.link;
                    }
                });

                container.appendChild(entry);
            }
        } catch (error) {
            console.error("Error loading games:", error);
        }
    }

    function SetCategory(category) {
        console.log("Selected category:", category);
    }

    LoadGames();
</script>
