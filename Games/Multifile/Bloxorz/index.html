<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloxorz - Flash</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        .container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .swf {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: none;
        }
    </style>
</head>
<body>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <div class="container">
        <embed class="swf"
               src="https://raw.githubusercontent.com/usheje883-maker/newlab/main/Games/Multifile/Bloxorz/bloxorz.swf"
               type="application/x-shockwave-flash">
    </div>
</body>
</html>
