<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Player</title>
    <link rel="stylesheet" href="oct.css">
</head>
<body>
    <div class="sidebar">
        <button class="button" onclick="location.href='/index.html'">Back</button>
    </div>

    <div class="gamearea">
        <div class="gamecontainer">
            <iframe class="gameplayer" allowfullscreen></iframe>

            <div class="extrabuttons">
                <button class="extrabutton" onclick="openInBlank()">Open in New Tab</button>
                <button class="extrabutton" onclick="fullscreenGame()">Fullscreen</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const rawSearch = window.location.search.substring(1);
        let gameInput = urlParams.get("game");

        if (!gameInput && rawSearch && !rawSearch.includes("=")) {
            gameInput = decodeURIComponent(rawSearch);
        }

        const gamePlayer = document.querySelector(".gameplayer");
        const gameContainer = document.querySelector(".gamecontainer");

        let processedGameHTML = "";
        let currentBlobUrl = null;

        function showError(message) {
            gamePlayer.srcdoc =
                '<!DOCTYPE html><html><body style="margin:0;background:#111;color:#fff;' +
                'font-family:Arial,sans-serif;display:flex;align-items:center;' +
                'justify-content:center;height:100vh;text-align:center;">' +
                "<h2>" + message + "</h2></body></html>";
        }

        async function loadGame(gameStr) {
            try {
                const fullUrl = new URL(gameStr, window.location.href).href;
                const dirBaseUrl = fullUrl.substring(0, fullUrl.lastIndexOf("/") + 1);

                const response = await fetch(fullUrl);
                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                let html = await response.text();

                const baseTag = '<base href="' + dirBaseUrl + '">';

                if (/<head[^>]*>/i.test(html)) {
                    html = html.replace(/<head[^>]*>/i, "$&" + baseTag);
                } else if (/<html[^>]*>/i.test(html)) {
                    html = html.replace(/<html[^>]*>/i, "$&<head>" + baseTag + "</head>");
                } else {
                    html = baseTag + html;
                }

                processedGameHTML = html;

                if (currentBlobUrl) {
                    URL.revokeObjectURL(currentBlobUrl);
                }

                currentBlobUrl = URL.createObjectURL(new Blob([html], { type: "text/html" }));
                gamePlayer.src = currentBlobUrl;
            } catch (error) {
                console.error("Game load failed:", error);
                showError("Failed to load game");
            }
        }

        if (gameInput) {
            loadGame(gameInput);
        } else {
            showError("No game selected");
        }

        function openInBlank() {
            if (!processedGameHTML) return;

            const newWindow = window.open("about:blank", "_blank");
            if (!newWindow) return;

            newWindow.document.open();
            newWindow.document.write(processedGameHTML);
            newWindow.document.close();
            newWindow.focus();
        }

        function fullscreenGame() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (gameContainer.requestFullscreen) {
                    gameContainer.requestFullscreen();
                } else if (gameContainer.webkitRequestFullscreen) {
                    gameContainer.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
