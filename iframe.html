<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Player</title>
    <link rel="stylesheet" href="oct.css">
</head>
<body>
    <div class="sidebar">
        <button class="button" onclick="location.href='/index.html'">Back</button>
    </div>

    <div class="gamearea">
        <div class="gamecontainer">
            <iframe id="gameIframe" class="gameplayer" allowfullscreen></iframe>

            <div class="extrabuttons">
                <button class="extrabutton" onclick="openInBlank()">Open in New Tab</button>
            </div>
        </div>
    </div>

    <script>
        const defaultGameUrl = "https://newlab.usheje883.workers.dev/iframe?Games%2FMultifile%2FBounceMasters%2Findex.html";

        const urlParams = new URLSearchParams(window.location.search);
        const gameUrl = urlParams.get('game') || defaultGameUrl;

        const iframe = document.getElementById('gameIframe');
        iframe.src = gameUrl;

        function openInBlank() {
            window.open(gameUrl, '_blank');
        }
    </script>
</body>
</html>
