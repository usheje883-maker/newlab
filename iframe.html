<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Player</title>
    <link rel="stylesheet" href="oct.css">
</head>
<body>
    <div class="sidebar">
        <button class="button" onclick="location.href='/index.html'">Back</button>
    </div>

    <div class="gamearea">
        <div class="gamecontainer">
            <iframe class="gameplayer" allowfullscreen></iframe>

            <div class="extrabuttons">
                <button class="extrabutton" onclick="openInBlank()">Open in New Tab</button>
            </div>
        </div>
    </div>

    <script>
        const fullQuery = window.location.search.substring(1);
        const pageIframe = document.querySelector('.gameplayer');
        const gameUrl = fullQuery ? decodeURIComponent(fullQuery) : '';

        if (gameUrl) {
            pageIframe.src = gameUrl;
        }

        function openInBlank() {
            if (!gameUrl) {
                alert("No game URL provided.");
                return;
            }

            const newWindow = window.open('about:blank', '_blank');

            if (newWindow) {
                const popupIframe = newWindow.document.createElement('iframe');
                popupIframe.src = gameUrl;
                popupIframe.allowFullscreen = true;
                popupIframe.style.position = 'fixed';
                popupIframe.style.top = '0';
                popupIframe.style.left = '0';
                popupIframe.style.width = '100vw';
                popupIframe.style.height = '100vh';
                popupIframe.style.border = 'none';
                popupIframe.style.margin = '0';
                popupIframe.style.padding = '0';
                popupIframe.style.overflow = 'hidden';

                newWindow.document.title = 'Game Player';
                newWindow.document.body.style.margin = '0';
                newWindow.document.body.appendChild(popupIframe);
            } else {
                alert("Please allow pop-ups for this site.");
            }
        }
    </script>
</body>
</html>
