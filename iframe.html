<style>
    body {
        margin: 0;
        background: #272727;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    .sidebar {
        position: fixed;
        top: 0;
        right: 0;
        width: 150px;
        height: 100vh;
        background: #1e1e1e;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 30px;
        z-index: 10;
    }

    .button {
        width: 100px;
        height: 100px;
        border: 0;
        border-radius: 25px;
        background: #252525;
        color: white;
        font-size: 23px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.25s ease, background 0.2s ease;
    }

    .button:hover {
        background: #444;
        transform: scale(1.08);
    }

    .gamearea {
        width: calc(100% - 150px);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .gamecontainer {
        width: 75%;
        height: 75%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 20px;
    }

    .gameplayer {
        width: 100%;
        height: calc(100% - 70px);
        border: 0;
        display: block;
        background: #111;
    }

    .extrabuttons {
        width: 100%;
        height: 70px;
        background: #3d3d3d;
        display: flex;
        align-items: center;
        padding-left: 15px;
        box-sizing: border-box;
    }

    .extrabutton {
        width: 150px;
        height: 50px;
        border: none;
        border-radius: 12px;
        background: #333;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
    }

    .extrabutton:hover {
        background: #4a4a4a;
        transform: scale(1.04);
    }
</style>

<div class="sidebar">
    <button class="button" onclick="location.href='/index.html'">Back</button>
</div>

<div class="gamearea">
    <div class="gamecontainer">
        <iframe class="gameplayer" allowfullscreen></iframe>

        <div class="extrabuttons">
            <button class="extrabutton" onclick="openInBlank()">Fullscreen</button>
        </div>
    </div>
</div>

<script>
    const gameUrl = decodeURIComponent(window.location.search.substring(1));
    const gamePlayer = document.querySelector(".gameplayer");

    function getGameUrl(url) {
        try {
            const parsed = new URL(url);
            const path = parsed.pathname.split("/").filter(Boolean);

            if (parsed.hostname === "github.com") {
                const user = path[0];
                const repo = path[1];

                if (path[2] === "blob" && path.length >= 5) {
                    const branch = path[3];
                    const filePath = path.slice(4).join("/");

                    return "https://raw.githubusercontent.com/" + user + "/" + repo + "/" + branch + "/" + filePath;
                }

                if (path[2] === "tree" && path.length >= 4) {
                    const branch = path[3];
                    const filePath = path.slice(4).join("/");

                    return "https://raw.githubusercontent.com/" + user + "/" + repo + "/" + branch + "/" + filePath + "/index.html";
                }
            }

            if (parsed.hostname === "raw.githubusercontent.com") {
                return url;
            }

            if (parsed.hostname.includes("jsdelivr.net")) {
                return url;
            }

            return url;
        } catch {
            return url;
        }
    }

    async function loadGame(url) {
        try {
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error("Failed to load game");
            }

            const html = await response.text();

            const blob = new Blob([html], {
                type: "text/html"
            });

            const blobUrl = URL.createObjectURL(blob);

            gamePlayer.src = blobUrl;

            window.currentGameUrl = blobUrl;
        } catch (error) {
            gamePlayer.srcdoc = `
                <html>
                    <body style="margin:0;background:#111;color:white;font-family:Arial;display:flex;align-items:center;justify-content:center;height:100vh;">
                        <h2>Failed to load game</h2>
                    </body>
                </html>
            `;
        }
    }

    const finalGameUrl = getGameUrl(gameUrl);

    if (finalGameUrl) {
        loadGame(finalGameUrl);
    }

    function openInBlank() {
        if (!finalGameUrl) return;

        window.open(finalGameUrl, "_blank");
    }
</script>
