        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
    }

        background: #4a4a4a;
        transform: scale(1.04);

<div class="sidebar">
    <button class="button" onclick="location.href='/index.html'">Back</button>
</div>

<div class="gamearea">
    <div class="gamecontainer">
        <iframe class="gameplayer" allowfullscreen></iframe>

        <div class="extrabuttons">
            <button class="extrabutton" onclick="openInBlank()">Fullscreen</button>
        </div>
    </div>
</div>

<script>
    const gameUrl = decodeURIComponent(window.location.search.substring(1));
    const gamePlayer = document.querySelector(".gameplayer");

    function getGameUrl(url) {
        if (url.includes("github.com/") && url.includes("/blob/")) {
            const parts = new URL(url);
            const path = parts.pathname.split("/");

            const user = path[1];
            const repo = path[2];
            const branch = path[4];
            const filePath = path.slice(5).join("/");

            return "https://cdn.jsdelivr.net/gh/" + user + "/" + repo + "@" + branch + "/" + filePath;
        }

        if (url.includes("raw.githubusercontent.com/")) {
            return url;
        }

        if (url.includes("github.com/")) {
            const parts = new URL(url);
            const path = parts.pathname.split("/").filter(Boolean);

            if (path.length >= 5 && path[3] === "tree") {
                const user = path[0];
                const repo = path[1];
                const branch = path[3];
                const filePath = path.slice(4).join("/");

                return "https://cdn.jsdelivr.net/gh/" + user + "/" + repo + "@" + branch + "/" + filePath + "/index.html";
            }
        }

        return url;
    }

    const finalGameUrl = getGameUrl(gameUrl);

    if (finalGameUrl) {
        gamePlayer.src = finalGameUrl;
    }

    function openInBlank() {
        if (!finalGameUrl) return;

        const newWindow = window.open(finalGameUrl, "_blank");

        if (!newWindow) {
            alert("Please allow pop-ups to use fullscreen.");
        }
    }
</script>
