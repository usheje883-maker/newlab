<style>
    body {
        background-color: #272727;
        margin: 0;
        height: 100vh;
        overflow: hidden;
    }

    .sidebar {
        background-color: #1e1e1e;
        width: 150px;
        height: 100vh;
        position: fixed;
        right: 0;
        top: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 30px;
        z-index: 10;
    }

    .button {
        width: 100px;
        height: 100px;
        border-radius: 25px;
        background-color: #252525;
        border: none;
        color: white;
        font-size: 25px;
        cursor: pointer;
        font-weight: bold;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s ease;
    }

    .button:hover {
        transform: scale(1.15);
        background-color: #444444;
    }

    .gamearea {
        width: calc(100vw - 150px);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .gameplayer {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }
</style>

<div class="sidebar">
    <button class="button" onclick="location.href='/index.html'">Back</button>
    <button class="button" onclick="openInBlank()">Fullscreen</button>
</div>

<div class="gamearea">
    <iframe class="gameplayer"></iframe>
</div>

<script>
    const fullQuery = window.location.search.substring(1);
    const pageIframe = document.querySelector(".gameplayer");

    if (fullQuery) {
        pageIframe.src = decodeURIComponent(fullQuery);
    }

    function openInBlank() {
        const newWindow = window.open("about:blank", "_blank");

        if (newWindow) {
            const popupIframe = newWindow.document.createElement("iframe");

            popupIframe.src = decodeURIComponent(fullQuery);
            popupIframe.style.position = "fixed";
            popupIframe.style.top = "0";
            popupIframe.style.left = "0";
            popupIframe.style.width = "100vw";
            popupIframe.style.height = "100vh";
            popupIframe.style.border = "none";
            popupIframe.style.margin = "0";
            popupIframe.style.padding = "0";
            popupIframe.style.overflow = "hidden";

            newWindow.document.title = "Home - Classroom";
            newWindow.document.body.style.margin = "0";
            newWindow.document.body.appendChild(popupIframe);
        } else {
            alert("allow pop-ups man");
        }
    }
</script>
