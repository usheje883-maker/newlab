```html
<style>
    body {
        margin: 0;
        background: #272727;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    .sidebar {
        position: fixed;
        top: 0;
        right: 0;
        width: 150px;
        height: 100vh;
        background: #1e1e1e;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 30px;
        z-index: 10;
    }

    .button {
        width: 100px;
        height: 100px;
        border: 0;
        border-radius: 25px;
        background: #252525;
        color: white;
        font-size: 23px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.25s ease, background 0.2s ease;
    }

    .button:hover {
        background: #444;
        transform: scale(1.08);
    }

    .gamearea {
        width: calc(100% - 150px);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .gamecontainer {
        width: 75%;
        height: 75%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 20px;
    }

    .gameplayer {
        width: 100%;
        height: calc(100% - 70px);
        border: 0;
        display: block;
        background: #111;
    }

    .extrabuttons {
        width: 100%;
        height: 70px;
        background: #3d3d3d;
        display: flex;
        align-items: center;
        padding-left: 15px;
        box-sizing: border-box;
    }

    .extrabutton {
        width: 150px;
        height: 50px;
        border: none;
        border-radius: 12px;
        background: #333;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
    }

    .extrabutton:hover {
        background: #4a4a4a;
        transform: scale(1.04);
    }
</style>

<div class="sidebar">
    <button class="button" onclick="location.href='/index.html'">Back</button>
</div>

<div class="gamearea">
    <div class="gamecontainer">
        <iframe class="gameplayer"></iframe>

        <div class="extrabuttons">
            <button class="extrabutton" onclick="openInBlank()">Fullscreen</button>
        </div>
    </div>
</div>

<script>
    const gameUrl = decodeURIComponent(window.location.search.substring(1));
    const gamePlayer = document.querySelector(".gameplayer");

    if (gameUrl) {
        gamePlayer.src = gameUrl;
    }

    function openInBlank() {
        if (!gameUrl) return;

        const newWindow = window.open(gameUrl, "_blank");

        if (!newWindow) {
            alert("Please allow pop-ups to use fullscreen.");
        }
    }
</script>
