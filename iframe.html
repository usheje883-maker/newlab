<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Player</title>
    <link rel="stylesheet" href="oct.css">
</head>
<body>
    <div class="sidebar">
        <button class="button" onclick="location.href='/index.html'">Back</button>
    </div>

    <div class="gamearea">
        <div class="gamecontainer">
            <iframe id="gameIframe" class="gameplayer" allowfullscreen></iframe>

            <div class="extrabuttons">
                <button class="extrabutton" onclick="openInBlank()">Open in New Tab</button>
            </div>
        </div>
    </div>

    <script>
        let gamePath = "";
        if (window.location.search.length > 1) {
            gamePath = decodeURIComponent(window.location.search.substring(1));
        }

        let finalGameUrl = "";

        if (gamePath) {
            if (gamePath.startsWith('http://') || gamePath.startsWith('https://')) {
                finalGameUrl = gamePath;
            } else {
                finalGameUrl = gamePath.startsWith('/') ? gamePath : '/' + gamePath;
            }
            
            document.getElementById('gameIframe').src = finalGameUrl;
        } else {
            console.error("No game path specified.");
        }

        function openInBlank() {
            if (finalGameUrl) {
                window.open(finalGameUrl, '_blank');
            }
        }
    </script>
</body>
</html>
