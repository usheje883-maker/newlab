<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Player</title>
</head>
<body>
    <div class="sidebar">
        <button class="button" onclick="location.href='/index.html'">Back</button>
    </div>

    <div class="gamearea">
        <div class="gamecontainer">
            <iframe class="gameplayer" allowfullscreen></iframe>

            <div class="extrabuttons">
                <button class="extrabutton" onclick="openInBlank()">Open in New Tab</button>
                <button class="extrabutton" onclick="fullscreenGame()">Fullscreen</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const rawSearch = window.location.search.substring(1);
        let gameInput = urlParams.get("game");

        if (!gameInput && rawSearch && !rawSearch.includes("=")) {
            gameInput = decodeURIComponent(rawSearch);
        }

        let repoInput = urlParams.get("repo");

        const gamePlayer = document.querySelector(".gameplayer");
        const gameContainer = document.querySelector(".gamecontainer");

        let resolvedGameUrl = "";
        let processedGameHTML = "";
        let currentBlobUrl = null;

        function resolveCDNUrls(gameStr, repoStr) {
            let fullUrl = gameStr;
            let repoBaseUrl = "";

            if (repoStr) {
                const cleanRepo = repoStr
                    .replace(/^https:\/\/cdn\.jsdelivr\.net\/gh\//, "")
                    .replace(/\/$/, "");

                repoBaseUrl = "https://cdn.jsdelivr.net/gh/" + cleanRepo + "/";

                if (
                    !gameStr.startsWith("http://") &&
                    !gameStr.startsWith("https://") &&
                    !gameStr.startsWith("//")
                ) {
                    fullUrl = repoBaseUrl + gameStr.replace(/^\//, "");
                }
            }

            try {
                const parsed = new URL(fullUrl, window.location.href);
                fullUrl = parsed.href;
                const path = parsed.pathname.split("/").filter(Boolean);

                if (
                    parsed.hostname === "github.com" ||
                    parsed.hostname === "raw.githubusercontent.com"
                ) {
                    const user = path[0];
                    const repo = path[1];
                    let branch = "main";
                    let filePath = "";

                    if (parsed.hostname === "github.com") {
                        if (path[2] === "blob" || path[2] === "raw" || path[2] === "tree") {
                            branch = path[3] || "main";
                            filePath = path.slice(4).join("/");
                        } else {
                            branch = path[2] || "main";
                            filePath = path.slice(3).join("/");
                        }
                    } else {
                        branch = path[2] || "main";
                        filePath = path.slice(3).join("/");
                    }

                    repoBaseUrl =
                        "https://cdn.jsdelivr.net/gh/" +
                        user +
                        "/" +
                        repo +
                        "@" +
                        branch +
                        "/";

                    fullUrl = repoBaseUrl + filePath;
                } else if (parsed.hostname.includes("jsdelivr.net")) {
                    const ghIndex = path.indexOf("gh");

                    if (ghIndex !== -1 && path.length >= ghIndex + 3) {
                        const user = path[ghIndex + 1];
                        const repoAndBranch = path[ghIndex + 2];

                        repoBaseUrl =
                            "https://cdn.jsdelivr.net/gh/" +
                            user +
                            "/" +
                            repoAndBranch +
                            "/";
                    }
                }
            } catch (e) {}

            const dirBaseUrl =
                fullUrl.substring(0, fullUrl.lastIndexOf("/") + 1);

            if (!repoBaseUrl) {
                repoBaseUrl = dirBaseUrl;
            }

            return {
                fullUrl,
                dirBaseUrl,
                repoBaseUrl
            };
        }

        async function loadGame(gameStr, repoStr) {
            try {
                const {
                    fullUrl,
                    dirBaseUrl,
                    repoBaseUrl
                } = resolveCDNUrls(gameStr, repoStr);

                resolvedGameUrl = fullUrl;

                const response = await fetch(fullUrl);

                if (!response.ok) {
                    throw new Error("Failed to load game file");
                }

                let html = await response.text();

                html = html
                    .replace(/(\s(?:src|href|data-src|poster)\s*=\s*["'])\/(?!\/)/gi, "$1" + repoBaseUrl)
                    .replace(/url\(\s*(["']?)\/(?!\/)/gi, "url($1" + repoBaseUrl);

                const baseTagAndScripts = `
                    <base href="${dirBaseUrl}">
                    <script>
                        (function() {
                            const dirBase = "${dirBaseUrl}";
                            const repoBase = "${repoBaseUrl}";
                            const parentOrigin = "${window.location.origin}";

                            function fix(url) {
                                if (!url || typeof url !== "string") return url;
                                if (/^(data:|blob:|javascript:|#|about:)/i.test(url)) return url;
                                try {
                                    const u = new URL(url, dirBase);
                                    const wrongHost =
                                        u.origin === parentOrigin ||
                                        (u.origin === "https://cdn.jsdelivr.net" &&
                                         !u.pathname.startsWith("/gh/") &&
                                         !u.pathname.startsWith("/npm/"));
                                    if (wrongHost) {
                                        return new URL(
                                            u.pathname.replace(/^\\//, "") + u.search + u.hash,
                                            repoBase
                                        ).href;
                                    }
                                    return u.href;
                                } catch (e) {
                                    return url;
                                }
                            }

                            const origFetch = window.fetch;
                            window.fetch = function(input, init) {
                                if (typeof input === "string") input = fix(input);
                                else if (input instanceof URL) input = fix(input.href);
                                else if (input instanceof Request) input = new Request(fix(input.url), input);
                                return origFetch.call(this, input, init);
                            };

                            const origOpen = XMLHttpRequest.prototype.open;
                            XMLHttpRequest.prototype.open = function(method, url, ...rest) {
                                return origOpen.call(this, method, fix(String(url)), ...rest);
                            };

                            if (window.Worker) {
                                const OrigWorker = window.Worker;
                                window.Worker = class extends OrigWorker {
                                    constructor(url, opts) { super(fix(String(url)), opts); }
                                };
                            }

                            const OrigAudio = window.Audio;
                            window.Audio = function(src) {
                                return new OrigAudio(src ? fix(src) : src);
                            };

                            [
                                [HTMLImageElement, "src"],
                                [HTMLScriptElement, "src"],
                                [HTMLMediaElement, "src"],
                                [HTMLSourceElement, "src"],
                                [HTMLLinkElement, "href"],
                                [HTMLIFrameElement, "src"]
                            ].forEach(([cls, prop]) => {
                                const desc = Object.getOwnPropertyDescriptor(cls.prototype, prop);
                                if (!desc || !desc.set) return;
                                Object.defineProperty(cls.prototype, prop, {
                                    get: desc.get,
                                    set(v) { desc.set.call(this, fix(String(v))); },
                                    configurable: true
                                });
                            });

                            const origSetAttr = Element.prototype.setAttribute;
                            Element.prototype.setAttribute = function(name, value) {
                                if (/^(src|href|data-src|poster)$/i.test(name)) value = fix(String(value));
                                return origSetAttr.call(this, name, value);
                            };
                        })();
                    <\/script>
                `;

                if (/<head[^>]*>/i.test(html)) {
                    html = html.replace(
                        /<head[^>]*>/i,
                        "$&" + baseTagAndScripts
                    );
                } else if (/<html[^>]*>/i.test(html)) {
                    html = html.replace(
                        /<html[^>]*>/i,
                        "$&<head>" + baseTagAndScripts + "</head>"
                    );
                } else {
                    html = baseTagAndScripts + html;
                }

                processedGameHTML = html;

                if (currentBlobUrl) {
                    URL.revokeObjectURL(currentBlobUrl);
                }

                const blob = new Blob(
                    [html],
                    { type: "text/html" }
                );

                currentBlobUrl = URL.createObjectURL(blob);
                gamePlayer.src = currentBlobUrl;

            } catch (error) {
                gamePlayer.srcdoc = `
                    <!DOCTYPE html>
                    <html>
                        <body style="
                            margin:0;
                            background:#111;
                            color:white;
                            font-family:Arial, sans-serif;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            height:100vh;
                        ">
                            <h2>Failed to load game from repository</h2>
                        </body>
                    </html>
                `;
            }
        }

        if (gameInput) {
            loadGame(gameInput, repoInput);
        }

        function openInBlank() {
            if (!processedGameHTML) {
                return;
            }

            const newWindow = window.open("about:blank", "_blank");

            if (!newWindow) {
                return;
            }

            newWindow.document.open();
            newWindow.document.write(processedGameHTML);
            newWindow.document.close();
            newWindow.focus();
        }

        function fullscreenGame() {
            if (!document.fullscreenElement) {
                if (gameContainer.requestFullscreen) {
                    gameContainer.requestFullscreen();
                } else if (gameContainer.webkitRequestFullscreen) {
                    gameContainer.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
