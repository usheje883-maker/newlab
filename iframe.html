<style>
    body {
        background-color: #272727;
        margin: 0;
        height: 100vh;
        overflow: hidden;
    }

    .sidebar {
        background-color: #1e1e1e;
        width: 150px;
        height: 100vh;
        position: fixed;
        right: 0;
        top: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 30px;
        z-index: 10;
    }

    .button {
        width: 100px;
        height: 100px;
        border-radius: 25px;
        background-color: #252525;
        border: none;
        color: white;
        font-size: 25px;
        cursor: pointer;
        font-weight: bold;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s ease;
    }

    .button:hover {
        transform: scale(1.15);
        background-color: #444444;
    }

    .gamearea {
        width: calc(100vw - 150px);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .gamecontainer {
        width: 75%;
        height: 75%;
        display: flex;
        flex-direction: column;
    }

    .gameplayer {
        width: 100%;
        height: calc(100% - 40px);
        border: none;
        display: block;
        border-radius: 20px 20px 0 0;
    }

    .extrabuttons {
        background-color: #3d3d3d;
        width: 100%;
        height: 40px;
        border-radius: 0 0 0 0;
    }
</style>

<div class="sidebar">
    <button class="button" onclick="location.href='/index.html'">Back</button>
    <button class="button" onclick="openInBlank()">Fullscreen</button>
</div>

<div class="gamearea">
    <div class="gamecontainer">
        <iframe class="gameplayer"></iframe>
        
        <div class="extrabuttons">
            
        </div>
</div>

</div>

<script>
    const fullQuery = window.location.search.substring(1);
    const pageIframe = document.querySelector(".gameplayer");
    const gameUrl = decodeURIComponent(fullQuery);

    async function loadGame() {
        if (!gameUrl) return;

        try {
            const response = await fetch(gameUrl);

            if (!response.ok) {
                throw new Error("Failed to load HTML file");
            }

            const html = await response.text();

            pageIframe.srcdoc = html;
        } catch (error) {
            pageIframe.srcdoc = `
                <html>
                    <body style="background:#111;color:white;font-family:Arial;text-align:center;padding-top:50px">
                        <h1>Failed to load game</h1>
                        <p>${error.message}</p>
                    </body>
                </html>
            `;
        }
    }

    async function openInBlank() {
        const newWindow = window.open("about:blank", "_blank");

        if (!newWindow) {
            alert("allow pop-ups man");
            return;
        }

        try {
            const response = await fetch(gameUrl);

            if (!response.ok) {
                throw new Error("Failed to load HTML file");
            }

            const html = await response.text();

            newWindow.document.open();
            newWindow.document.write(html);
            newWindow.document.close();
            newWindow.document.title = "Home - Classroom";
        } catch (error) {
            newWindow.document.body.innerHTML = `
                <h1>Failed to load game</h1>
                <p>${error.message}</p>
            `;
        }
    }

    loadGame();
</script>
